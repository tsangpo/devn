name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to resume
        required: true
        type: string
      artifact_run_id:
        description: Original tag-triggered Release run with successful builds
        required: true
        type: string
permissions:
  contents: read
  actions: read
# Serialize versions, including tap updates. Never cancel a partially published release.
concurrency:
  group: release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
jobs:
  pack:
    if: github.repository == 'tsangpo/devn' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate stable version tag
        run: bun -e 'import {releaseTag} from "./scripts/release-lib.ts"; releaseTag()'
      - run: bun run check
      - run: bun run check:secrets
      - run: bun run release:pack
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-package
          path: release/devn.tgz*
          if-no-files-found: error
          retention-days: 30
  binaries:
    # Binary distribution is temporarily disabled; keep the job for re-enabling later.
    if: ${{ false }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Download npm package
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name npm-package --dir release
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun scripts/check-release.ts release/devn.tgz
      - run: bun test ./test/package.test.ts
        env:
          DEVN_PACKAGE_TARBALL: ${{ github.workspace }}/release/devn.tgz
      - run: bun run build:binary
      - run: bun run test:binary
      - if: matrix.platform == 'windows-x64'
        run: bun run build:installer
      - if: matrix.platform == 'windows-x64'
        run: bun run test:installer
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-${{ matrix.platform }}
          path: |
            release/*.tar.gz*
            release/*.zip*
            release/install.ps1*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [pack, binaries]
    if: >-
      always() && !cancelled() && github.repository == 'tsangpo/devn' &&
      needs.pack.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # npm is only the publisher. The application and all tests use Bun.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - run: bun scripts/check-release-source.ts
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download verified release archives
        run: |
          for artifact in npm-package; do
            gh run download "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir release
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun run release:prepare
        if: ${{ false }}
      - run: bun scripts/publish-github.ts stage
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
      # npm authenticates using GitHub OIDC; no long-lived npm token is injected.
      - run: bun scripts/publish-npm.ts
        env:
          # npm otherwise hides OIDC exchange failures behind a generic publish error.
          NPM_CONFIG_LOGLEVEL: verbose
      - run: bun scripts/publish-github.ts publish
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ false }}
        with:
          name: release-inputs
          path: |
            release/*.tgz*
            release/*.tar.gz*
            release/*.zip*
            release/install.ps1*
            release/SHA256SUMS
            release/devn.rb
          if-no-files-found: error
  verify-windows-installer:
    needs: publish
    # Binary distribution is disabled, so there is no installer to verify.
    if: ${{ false }}
    runs-on: windows-2025
    steps:
      - name: Install from the public release endpoint
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = gh api repos/tsangpo/devn/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect latest release' }
          $url = 'https://github.com/tsangpo/devn/releases/latest/download/install.ps1'
          if ($latest -ne $env:RELEASE_TAG) {
            # Recovering an older release must not demote or install a newer Latest.
            $url = 'https://github.com/tsangpo/devn/releases/download/' + $env:RELEASE_TAG + '/install.ps1'
          }
          irm $url | iex
          if ((devn --version) -ne $env:RELEASE_TAG.Substring(1)) { throw 'Installed version differs from the release' }
          # A new PowerShell process inherits the refreshed PATH from this installer session.
          if ((& powershell.exe -NoProfile -Command 'devn --version') -ne $env:RELEASE_TAG.Substring(1)) {
            throw 'New terminal could not find the released devn'
          }
  verify-homebrew:
    needs: publish
    # Binary distribution is disabled, so there is no Homebrew artifact to verify.
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        # Hosted Linux kernels lack Landlock ABI 10; keep Homebrew's sandbox
        # enabled and its capability warning visible.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download release inputs
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-inputs --dir formula
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478
      - name: Install and test the released binary via a temporary tap
        shell: bash
        run: |
          brew tap-new --no-git devn-ci/release
          cp formula/devn.rb "$(brew --repository devn-ci/release)/Formula/devn.rb"
          brew install devn-ci/release/devn
          brew test devn-ci/release/devn
          devn --version
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_DEVELOPER: '1'
  update-tap:
    needs: verify-homebrew
    # Binary distribution is disabled, so the tap is not updated.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Download release inputs
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-inputs --dir release
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7.0.1
        with:
          repository: tsangpo/homebrew-tap
          ref: main
          path: tap
          token: ${{ secrets.GH_PAT }}
      - run: bun scripts/update-tap.ts tap
