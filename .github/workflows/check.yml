name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun run check
      - run: bun run check:secrets
      - run: bun run build:binary
      - run: bun run test:binary
  windows:
    name: Windows x64 (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cli
            tests: ./test/cli.test.ts
          - suite: prompts
            tests: ./test/prompt.test.ts
          - suite: storage
            tests: ./test/store.test.ts ./test/security.test.ts
          - suite: distribution
            tests: ./test/entry.test.ts ./test/package.test.ts ./test/release.test.ts ./test/platform-boundary.test.ts ./test/windows
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bun test ${{ matrix.tests }} --timeout 180000 --bail
      - run: bun run validate
      - if: matrix.suite == 'distribution'
        run: bun run check:secrets
      - if: matrix.suite == 'distribution'
        run: bun run build:binary
      - if: matrix.suite == 'distribution'
        run: bun run test:binary
      - if: matrix.suite == 'distribution'
        run: bun run build:installer
      - if: matrix.suite == 'distribution'
        run: bun run test:installer
      - if: matrix.suite == 'distribution'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-verified
          path: |
            release/*.zip*
            release/install.ps1*
          if-no-files-found: error
      - name: Install pinned clients for local-gateway smoke tests
        if: matrix.suite == 'distribution'
        run: npm install --global @openai/codex@0.159.3 @anthropic-ai/claude-code@2.1.286
      - if: matrix.suite == 'distribution'
        run: bun run test:native
